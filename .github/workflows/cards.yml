name: Refresh profile cards

on:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: [main]
    paths:
      - profile.json
      - scripts/**
      - assets/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools brotli
      - name: Render cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_cards.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards
          git commit -m "chore: refresh profile cards" || echo "no changes"
          git push
